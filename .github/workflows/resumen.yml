name: Noticias del dia

on:
  schedule:
    - cron: '0 5,6 * * *' # 7:00 en Madrid: las 5:00 UTC en verano y las 6:00 UTC en invierno
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar noticias
        if: github.event_name != 'push'
        working-directory: resumen-semanal
        run: node scripts/generar.mjs
      - name: Guardar cambios
        if: github.event_name != 'push'
        working-directory: resumen-semanal
        run: |
          git config user.name "Mi Semana"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Noticias $(date +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: resumen-semanal
      - id: despliegue
        uses: actions/deploy-pages@v4
